<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <img src="https://share.google/JLGuGkx4Ke0hQ6qs5" alt="Image 1" onclick="openLightbox(this)">
        <img src="https://share.google/TM0hGuSViPTddqthE" alt="Image 2" onclick="openLightbox(this)">
        <img src="https://share.google/C22PWUShO87MhNIK5" alt="Image 3" onclick="openLightbox(this)">
        <img src="https://share.google/FmDyDF5hdae7cnAec" alt="Image 4" onclick="openLightbox(this)">
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
